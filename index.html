<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <title>Paymen form example</title>
</head>

<body class="d-flex justify-content-center align-items-center min-vh-100">
    <form action="">
    <div class="container">

        <div class="card">
            <div class="card-header">
                <h2>Payment form example</h2>
            </div>
            <div class="card-body">
                <div class="col p-2 rounded d-none" id="missing">
                    <h6>Some fields are missing</h6>
                </div>
                <div class="row g-4">
                    <div class="col-md-5"><label for="card">Card #</label>
                        <input required class="form-control" type="text" name="Card" placeholder="XXXXXXXXXXXXXXXX" id="card">
                    </div>
                    <div class="col-md-3"> <label for="cvc">CVC #</label>
                        <input required class="form-control" type="number" name="cvc" placeholder="0000" id="cvc">
                    </div>
                    <div class="col-md-4">
                        <label for="amount">Amount $</label>
                        <input required class="form-control" type="number" name="amount" placeholder="Amount" id="amount">
                    </div>
                </div>
                <div class="row g-4">
                    <div class="col-md-6"><label for="first-name">First Name</label><input required class="form-control" type="text"
                            name="first-name" id="first-name"></div>
                    <div class="col-md-6"><label for="Last-name">Last Name</label><input required class="form-control" type="text"
                            name="Last-name" id="Last-name"></div>
                </div>
                <div class="row g-4">
                    <div class="col-md-6"><label for="city">City</label>
                        <input required class="form-control" type="text" name="city" id="city">
                    </div>
                    <div class="col-md-3"> <label for="state">State</label>
                        <select required class="form-select" name="state" id="state">
                            <option value="" selected disabled hidden>Pick a state</option>
                            <option value="married">Married</option>
                            <option value="single">Single</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="postal-code">Postal Code</label>
                        <input required class="form-control" type="number" name="postal-code" id="postal-code">
                    </div>
                </div>
                <div class="row g-4">
                    <div class="col-md-6">
                        <p>We accept:</p>
                        <div class="bg-secondary p-3 rounded d-inline text-light d-inline-flex gap-2">
                        <input required type="radio" name="payment-method" id="mastercard"> <label
                            for="mastercard"><i class="fa-brands fa-cc-mastercard"></i></label>
                        <input required type="radio" name="payment-method" id="visa"> <label
                            for="visa"><i class="fa-brands fa-cc-visa"></i></label>
                        <input required type="radio" name="payment-method" id="paypal"> <label
                            for="paypal"><i class="fa-brands fa-cc-paypal"></i></label>
                        <input required type="radio" name="payment-method" id="money-bill"> <label
                            for="money-bill"><i class="fa-solid fa-money-bill"></i></label>
                        </div>
                        </div>
                    <div class="col-md-6"><label for="message">Message</label><textarea rows="4" class="form-control" name="message"
                            id="message"></textarea></div>
                </div>
                <div class="row g-4">
                    <div class="col">
                        <input required type="checkbox" name="terms-conditions" id="terms-conditions"> <label for="terms-conditions">Agree to terms and conditions</label>
                    </div>
                </div>
            </div>
<div class="card-footer">
    <div class="d-grid gap-2 my-1 d-flex justify-content-end">
  <button class="btn btn-secondary " type="reset">Cancel</button>
  <button class="btn btn-primary" type="submit">Send</button>
</div>
</div>

        </div>

    </div>


</form>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
</body>

</html>
